aid: osly
name: Osly
description: Osly is an AI workflow automation platform (a product of Alore AI) that lets startups
  and prosumers build N8N-based AI workflows from natural language, with no coding required. Users
  describe automations in plain English to generate email sequences, lead categorization and personalized
  outreach, spin up internal dashboard UIs, and connect 50+ apps including HubSpot, Salesforce, Google
  Drive, Notion, LinkedIn and Shopify. Osly was surfaced as a portfolio company of 500 Global and added
  to the API Evangelist network. It publishes no developer portal, no API documentation and no OpenAPI;
  the only machine-readable description of its API is the company's own first-party TypeScript SDK in
  github.com/Osly-AI, which documents an X-API-Key REST surface plus a Socket.IO execution stream at
  api.pocketflow.ai — the company's prior brand domain, since pocketflow.ai redirects to osly.ai. As of
  2026-08-14 every application and API host in the estate (app.osly.ai, api.osly.ai, api.pocketflow.ai,
  app.alore.ai) returns Cloudflare 522; only the marketing site and blog respond.
