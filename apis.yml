apis:
- name: Osly Workflow API (PocketFlow)
  description: The workflow list, detail and execution surface behind Osly, as documented by the
    company's own first-party TypeScript SDK. Two REST reads (GET /workflows, GET /workflows/{id})
    authenticated with an X-API-Key header carrying a pfl_-prefixed key, plus a Socket.IO channel where
    a client emits run_workflow and receives run_start / stream_output / node_error / run_complete
    events. Osly publishes no API reference, no OpenAPI and no changelog for this surface, and the base
    host currently returns Cloudflare 522 (origin unreachable).
  humanURL: https://github.com/Osly-AI/Pocketflow-SDK
  baseURL: https://api.pocketflow.ai
